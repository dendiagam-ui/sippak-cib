<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Permohonan | SIPPAK-CIB</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        body { background: #f8fafc; padding: 15px; color: #1e293b; }
        
        .wadah-form { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        
        /* Desain Header Layanan (Seperti di Gambar Anda) */
        .box-layanan { background: #eff6ff; border: 1px solid #bfdbfe; padding: 20px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
        .box-layanan label { display: block; font-weight: 800; color: #1e40af; margin-bottom: 10px; font-size: 15px; }
        .box-layanan select { width: 100%; max-width: 300px; padding: 12px; border-radius: 8px; border: 1px solid #93c5fd; font-weight: bold; color: #1e293b; text-align: center; font-size: 15px; outline: none; }
        .box-layanan select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }

        /* Desain Judul Bagian */
        .section-title { font-size: 16px; font-weight: 800; color: #1e293b; margin: 25px 0 20px 0; padding: 12px 15px; background: #f8fafc; border-left: 5px solid #2563eb; border-radius: 4px 8px 8px 4px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }

        /* Form Group */
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; color: #475569; font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #fff; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn-submit { background: #2563eb; color: white; padding: 16px; width: 100%; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 30px; box-shadow: 0 4px 10px rgba(37,99,235,0.2); }
        .btn-submit:hover { background: #1d4ed8; transform: translateY(-2px); }
        
        /* Modal Konfirmasi */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(3px); }
        .modal-box { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 450px; text-align: center; }
        .btn-konfirmasi { background: #10b981; color: white; padding: 14px; width: 100%; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; margin-top: 20px; cursor: pointer; }
        .btn-batal { background: #f1f5f9; color: #475569; padding: 14px; width: 100%; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="wadah-form">
        <form id="formPengajuan" onsubmit="validasiDuplikat(event)">
            
            <!-- DROPDOWN PILIHAN LAYANAN (WAJIB MEMILIKI ONCHANGE) -->
            <div class="box-layanan">
                <label><i class="fas fa-list-check"></i> Pilih Jenis Layanan *</label>
                <select id="jenis_layanan" onchange="sesuaikanForm()" required>
                    <option value="" disabled selected>-- Ketuk untuk memilih --</option>
                    <option value="Cetak Kartu Keluarga">Cetak Kartu Keluarga (KK)</option>
                    <option value="Cetak Ulang KTP-El">Cetak Ulang KTP-El (Hilang/Rusak)</option>
                    <option value="Perbaikan Data">Perbaikan Data Kependudukan</option>
                    <option value="Pindah Keluar">Pindah Keluar Daerah</option>
                    <option value="Akta Kelahiran Tanpa NIK">Akta Kelahiran Tanpa NIK</option>
                </select>
            </div>

            <!-- DATA PEMOHON UMUM -->
            <div class="section-title"><i class="fas fa-user-circle"></i> 1. DATA PEMOHON</div>
            
            <div class="form-group">
                <label>Nomor Induk Kependudukan (NIK) *</label>
                <input type="number" id="nik" placeholder="Masukkan 16 Digit NIK" required>
            </div>
            <div class="form-group">
                <label>Nomor Kartu Keluarga *</label>
                <input type="number" id="no_kk" placeholder="Masukkan 16 Digit Nomor KK" required>
            </div>
            <div class="form-group">
                <label>Nama Lengkap Pemohon *</label>
                <input type="text" id="nama" placeholder="Sesuai KTP" required style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label>Nomor WhatsApp *</label>
                <input type="text" id="no_wa" placeholder="Awalan 62..." onkeyup="formatWA(this)" required>
            </div>
            <div class="form-group">
                <label>Email (Opsional)</label>
                <input type="email" id="email" placeholder="Contoh: nama@email.com">
            </div>

            <!-- ========================================== -->
            <!-- BLOK LAYANAN DINAMIS (AWALNYA TERSEMBUNYI) -->
            <!-- ========================================== -->

            <!-- 1. BLOK CETAK KK -->
            <div id="blokCetakKK" style="display: none;">
                <div class="section-title"><i class="fas fa-file-alt"></i> 2. PERSYARATAN CETAK KK</div>
                <div class="form-group"><label>Surat Kehilangan Kepolisian (Jika KK Hilang)</label><input type="file" id="file_kk_hilang"></div>
                <div class="form-group"><label>Dokumen Pendukung (Opsional)</label><input type="file" id="dokumen_pendukung_kk"></div>
                <div class="form-group"><label>Keterangan Tambahan</label><textarea id="keterangan" placeholder="Tuliskan keterangan jika ada..."></textarea></div>
            </div>

            <!-- 2. BLOK CETAK KTP -->
            <div id="blokCetakKTP" style="display: none;">
                <div class="section-title"><i class="fas fa-id-card"></i> 2. PERSYARATAN CETAK KTP</div>
                <div class="form-group"><label>NIK KTP yang diajukan *</label><input type="number" id="nik_pengajuan"></div>
                <div class="form-group"><label>Nama KTP yang diajukan *</label><input type="text" id="nama_pengajuan"></div>
                <div class="form-group">
                    <label>Alasan Cetak Ulang *</label>
                    <select id="alasan_pengajuan">
                        <option value="Hilang">KTP Hilang</option>
                        <option value="Rusak">KTP Rusak / Patah</option>
                    </select>
                </div>
                <div class="form-group"><label>Upload Surat Kehilangan / KTP Rusak *</label><input type="file" id="file_ktp"></div>
                <div class="form-group"><label>Upload Kartu Keluarga (KK) Asli *</label><input type="file" id="file_kk"></div>
            </div>

            <!-- 3. BLOK PERBAIKAN DATA -->
            <div id="blokPerbaikan" style="display: none;">
                <div class="section-title"><i class="fas fa-user-edit"></i> 2. FORMULIR PERBAIKAN DATA</div>
                <div class="form-group"><label>NIK yang diperbaiki *</label><input type="number" id="nik_perbaikan"></div>
                <div class="form-group"><label>Nama Lengkap *</label><input type="text" id="nama_perbaikan"></div>
                <div class="form-group"><label>Penjelasan Perbaikan (Contoh: Ubah Status Kawin) *</label><textarea id="keterangan_perbaikan"></textarea></div>
                <div class="form-group"><label>Upload Formulir F1.06 (Bermaterai) *</label><input type="file" id="file_f106"></div>
                <div class="form-group"><label>Upload Dokumen Bukti Perbaikan *</label><input type="file" id="dokumen_tambahan_perbaikan"></div>
                <div class="form-group"><label>Dokumen Pendukung 1 (Opsional)</label><input type="file" id="dokumen_pendukung_1"></div>
                <div class="form-group"><label>Dokumen Pendukung 2 (Opsional)</label><input type="file" id="dokumen_pendukung_2"></div>
            </div>

            <!-- 4. BLOK PINDAH KELUAR -->
            <div id="blokPindah" style="display: none;">
                <div class="section-title"><i class="fas fa-truck-moving"></i> 2. FORMULIR PINDAH KELUAR</div>
                <div class="form-group"><label>Alamat Asal (Lengkap) *</label><textarea id="alamat_asal"></textarea></div>
                <div class="form-group"><label>Alamat Tujuan Pindah (Lengkap) *</label><textarea id="alamat_tujuan"></textarea></div>
                <div class="form-group">
                    <label>Alasan Pindah *</label>
                    <select id="alasan_pindah">
                        <option value="Pekerjaan">Pekerjaan</option>
                        <option value="Pendidikan">Pendidikan</option>
                        <option value="Keluarga">Keluarga</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                <div class="form-group"><label>Upload Kartu Keluarga (KK) Asli *</label><input type="file" id="file_kk_pindah"></div>
                <div class="form-group"><label>Upload KTP Asli *</label><input type="file" id="file_ktp_pindah"></div>
                
                <h4 style="margin: 25px 0 10px 0; color: #1e40af; font-size: 14px;">Anggota Keluarga Yang Pindah</h4>
                <div class="form-group">
                    <label>Pilih Jumlah Anggota</label>
                    <select id="jumlah_pindah" onchange="generateAnggotaPindah()" style="background: #eff6ff;">
                        <option value="0" selected>Tidak ada (Hanya Pemohon)</option>
                        <option value="1">1 Orang</option><option value="2">2 Orang</option><option value="3">3 Orang</option>
                        <option value="4">4 Orang</option><option value="5">5 Orang</option><option value="6">6 Orang</option>
                        <option value="7">7 Orang</option><option value="8">8 Orang</option><option value="9">9 Orang</option>
                        <option value="10">10 Orang</option>
                    </select>
                </div>
                <div id="wadahAnggotaPindah"></div>
            </div>

            <!-- 5. BLOK AKTA KELAHIRAN -->
            <div id="blokAktaKelahiran" style="display: none;">
                <!-- Data Saksi -->
                <div class="section-title"><i class="fas fa-users"></i> 2. DATA SAKSI</div>
                <div class="grid-2">
                    <div class="form-group"><label>NIK Saksi 1 *</label><input type="number" id="nik_saksi_1"></div>
                    <div class="form-group"><label>Nama Lengkap Saksi 1 *</label><input type="text" id="nama_saksi_1"></div>
                    <div class="form-group"><label>NIK Saksi 2 *</label><input type="number" id="nik_saksi_2"></div>
                    <div class="form-group"><label>Nama Lengkap Saksi 2 *</label><input type="text" id="nama_saksi_2"></div>
                </div>

                <!-- Data Orang Tua -->
                <div class="section-title"><i class="fas fa-user-friends"></i> 3. DATA ORANG TUA</div>
                <div class="grid-2">
                    <div class="form-group"><label>NIK Ayah *</label><input type="number" id="nik_ayah"></div>
                    <div class="form-group"><label>Nama Lengkap Ayah *</label><input type="text" id="nama_ayah"></div>
                    <div class="form-group"><label>NIK Ibu *</label><input type="number" id="nik_ibu"></div>
                    <div class="form-group"><label>Nama Lengkap Ibu *</label><input type="text" id="nama_ibu"></div>
                </div>

                <!-- Biodata Anak -->
                <div class="section-title"><i class="fas fa-baby"></i> 4. BIODATA ANAK</div>
                <div class="form-group"><label>Nama Lengkap Anak *</label><input type="text" id="nama_anak"></div>
                <div class="grid-2">
                    <div class="form-group"><label>Tempat Lahir *</label><input type="text" id="tempat_lahir_anak"></div>
                    <div class="form-group"><label>Tanggal Lahir *</label><input type="date" id="tgl_lahir_anak"></div>
                    <div class="form-group"><label>Waktu Kelahiran *</label><input type="time" id="waktu_lahir_anak"></div>
                    <div class="form-group"><label>Kelahiran Ke- *</label><input type="number" id="anak_ke" placeholder="Contoh: 1"></div>
                    <div class="form-group"><label>Berat Bayi (Kg) *</label><input type="number" step="0.1" id="berat_anak" placeholder="Contoh: 3.2"></div>
                    <div class="form-group"><label>Panjang Bayi (Cm) *</label><input type="number" step="0.1" id="panjang_anak" placeholder="Contoh: 50"></div>
                </div>
                <div class="form-group"><label>Keterangan (Opsional)</label><textarea id="keterangan_akta"></textarea></div>

                <!-- Dokumen Lampiran Akta -->
                <div class="section-title"><i class="fas fa-file-upload"></i> 5. UPLOAD DOKUMEN</div>
                <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed #94a3b8;">
                    <div class="form-group"><label>Formulir F2.01 *</label><input type="file" id="file_akta_f201"></div>
                    <div class="form-group"><label>Kartu Keluarga *</label><input type="file" id="file_akta_kk"></div>
                    <div class="form-group"><label>Surat Keterangan Kelahiran *</label><input type="file" id="file_akta_ket_lahir"></div>
                    <div class="form-group"><label>Buku Nikah Hal 1 *</label><input type="file" id="file_akta_buku_nikah_1"></div>
                    <div class="form-group"><label>Buku Nikah Hal 2 *</label><input type="file" id="file_akta_buku_nikah_2"></div>
                    <div class="form-group"><label>Buku Nikah Hal 3 *</label><input type="file" id="file_akta_buku_nikah_3"></div>
                    <div class="form-group"><label>KTP Ibu *</label><input type="file" id="file_akta_ktp_ibu"></div>
                    <div class="form-group"><label>KTP Ayah *</label><input type="file" id="file_akta_ktp_ayah"></div>
                    <div class="form-group"><label>Dokumen Pendukung (Opsional)</label><input type="file" id="file_akta_pendukung"></div>
                    <div class="form-group"><label>Dokumen Pendukung 1 (Opsional)</label><input type="file" id="file_akta_pendukung_1"></div>
                    <div class="form-group"><label>Dokumen Pendukung 2 (Opsional)</label><input type="file" id="file_akta_pendukung_2"></div>
                </div>
            </div>

            <!-- TOMBOL SUBMIT UTAMA -->
            <button type="submit" class="btn-submit" id="btnUtama"><i class="fas fa-search"></i> Cek & Validasi Ringkasan Data</button>
            
        </form>
    </div>

    <!-- MODAL KONFIRMASI -->
    <div class="modal-overlay" id="modalRingkasan">
        <div class="modal-box" id="modalKonten">
            <h3 style="margin-bottom: 15px; color: #1e293b;"><i class="fas fa-check-circle" style="color: #10b981;"></i> Konfirmasi Pengiriman</h3>
            <p style="color: #475569; font-size: 14px; margin-bottom: 15px;">Mohon periksa kembali ringkasan permohonan Anda:</p>
            <div id="isiRingkasan" style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 14px; margin-bottom: 20px; line-height: 1.6; text-align: left;"></div>
            <button class="btn-konfirmasi" id="btnKonfirmasi" onclick="prosesKirimAkhir()"><i class="fas fa-upload"></i> Kirim Permohonan Sekarang</button>
            <button class="btn-batal" id="btnBatal" onclick="tutupModal()">Batal & Periksa Lagi</button>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // KONEKSI DATABASE
        const URL_DB = 'https://ufplggwklwopzhhwrdqk.supabase.co';
        const KEY_DB = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmcGxnZ3drbHdvcHpoaHdyZHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0Nzc1NDgsImV4cCI6MjEwMDA1MzU0OH0.ftwHcf3pkJkTJUDCYQJDiWVyRzfvbq10CoT6T7B0hEo';
        const supabaseClient = window.supabase.createClient(URL_DB, KEY_DB);
        let dataDraft = {};

        // Format No WA otomatis
        function formatWA(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
            if (input.value.startsWith('0')) input.value = '62' + input.value.substring(1);
        }

        // Generate Form Anggota Pindah Dinamis
        function generateAnggotaPindah() {
            const jumlah = document.getElementById('jumlah_pindah').value;
            const wadah = document.getElementById('wadahAnggotaPindah');
            wadah.innerHTML = ''; 
            for(let i = 1; i <= jumlah; i++) {
                wadah.innerHTML += `
                    <div style="background:#f8fafc; padding:15px; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:15px;">
                        <h4 style="color:#1e40af; margin-bottom:10px; font-size:14px;"><i class="fas fa-user-tag"></i> Anggota ke-${i}</h4>
                        <div class="form-group"><label>NIK Anggota</label><input type="number" id="nik_anggota_${i}" required></div>
                        <div class="form-group"><label>Nama Anggota</label><input type="text" id="nama_anggota_${i}" required></div>
                        <div class="form-group"><label>Status Hubungan</label>
                            <select id="status_anggota_${i}" required>
                                <option value="" disabled selected>-- Pilih --</option>
                                <option value="Suami">Suami</option><option value="Istri">Istri</option><option value="Anak">Anak</option>
                            </select>
                        </div>
                    </div>`;
            }
        }

        // LOGIKA PENAMPILAN FORM (TIDAK AKAN ERROR MESKI ADA ELEMEN KOSONG)
        function sesuaikanForm() {
            const ddl = document.getElementById('jenis_layanan');
            if (!ddl) return;
            const layanan = ddl.value;

            // Tangkap ID Blok
            const bKK = document.getElementById('blokCetakKK');
            const bKTP = document.getElementById('blokCetakKTP');
            const bPerbaikan = document.getElementById('blokPerbaikan');
            const bPindah = document.getElementById('blokPindah');
            const bAkta = document.getElementById('blokAktaKelahiran');
            
            // Sembunyikan Semua Blok
            if (bKK) bKK.style.display = 'none'; 
            if (bKTP) bKTP.style.display = 'none'; 
            if (bPerbaikan) bPerbaikan.style.display = 'none'; 
            if (bPindah) bPindah.style.display = 'none';
            if (bAkta) bAkta.style.display = 'none';
            
            // Atur ulang required form pindah
            const elAsal = document.getElementById('alamat_asal');
            const elTujuan = document.getElementById('alamat_tujuan');
            const elAlasan = document.getElementById('alasan_pindah');
            if(elAsal) elAsal.required = false; 
            if(elTujuan) elTujuan.required = false; 
            if(elAlasan) elAlasan.required = false; 

            // Tampilkan yang dipilih
            if (layanan === 'Cetak Kartu Keluarga' && bKK) bKK.style.display = 'block'; 
            else if (layanan === 'Cetak Ulang KTP-El' && bKTP) bKTP.style.display = 'block'; 
            else if (layanan === 'Perbaikan Data' && bPerbaikan) bPerbaikan.style.display = 'block'; 
            else if (layanan === 'Pindah Keluar' && bPindah) { 
                bPindah.style.display = 'block'; 
                if(elAsal) elAsal.required = true; 
                if(elTujuan) elTujuan.required = true; 
                if(elAlasan) elAlasan.required = true; 
            }
            else if (layanan === 'Akta Kelahiran Tanpa NIK' && bAkta) {
                bAkta.style.display = 'block';
            }
        }

        // KLIK TOMBOL CEK VALIDASI
        async function validasiDuplikat(event) {
            event.preventDefault(); 
            const btn = document.getElementById('btnUtama');
            const teksAsli = btn.innerHTML;
            
            const nik = document.getElementById('nik').value;
            const no_kk = document.getElementById('no_kk').value;
            const nama = document.getElementById('nama').value.toUpperCase();
            const no_wa = document.getElementById('no_wa').value;
            const email = document.getElementById('email').value || null;
            const layanan = document.getElementById('jenis_layanan').value;
            
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Memeriksa Data...";
            btn.disabled = true;

            try {
                // Cek apakah NIK ini masih punya antrean yang sama
                const { data, error } = await supabaseClient.from('permohonan').select('status').eq('nik', nik).eq('jenis_layanan', layanan).neq('status', 'Selesai').neq('status', 'Ditolak');
                if (error) throw error;
                
                if (data && data.length > 0) {
                    alert(`⚠️ PENGAJUAN DITOLAK!\n\nNIK ${nik} masih memiliki permohonan "${layanan}" yang sedang diproses petugas.`);
                    btn.innerHTML = teksAsli; btn.disabled = false;
                    return; 
                }

                // Pengumpulan Data Rincian
                let rincian = "";
                if (layanan === 'Cetak Kartu Keluarga') {
                    rincian += "Keterangan Warga: " + (document.getElementById('keterangan').value || "-");
                } 
                else if (layanan === 'Cetak Ulang KTP-El') {
                    rincian += "NIK Diajukan: " + document.getElementById('nik_pengajuan').value + "\n";
                    rincian += "Nama Diajukan: " + document.getElementById('nama_pengajuan').value + "\n";
                    rincian += "Alasan: " + document.getElementById('alasan_pengajuan').value;
                } 
                else if (layanan === 'Perbaikan Data') {
                    rincian += "NIK Perbaikan: " + document.getElementById('nik_perbaikan').value + "\n";
                    rincian += "Nama Perbaikan: " + document.getElementById('nama_perbaikan').value + "\n";
                    rincian += "Keterangan Perbaikan: " + document.getElementById('keterangan_perbaikan').value;
                } 
                else if (layanan === 'Pindah Keluar') {
                    rincian += "Alamat Asal: " + document.getElementById('alamat_asal').value + "\n";
                    rincian += "Alamat Tujuan: " + document.getElementById('alamat_tujuan').value + "\n";
                    rincian += "Alasan Pindah: " + document.getElementById('alasan_pindah').value + "\n";
                    const jumlahPindah = parseInt(document.getElementById('jumlah_pindah').value);
                    if(jumlahPindah > 0) {
                        rincian += "\n--- ANGGOTA YANG PINDAH ---\n";
                        for(let i = 1; i <= jumlahPindah; i++) {
                            rincian += `${i}. NIK: ${document.getElementById('nik_anggota_'+i).value} | Nama: ${document.getElementById('nama_anggota_'+i).value} (${document.getElementById('status_anggota_'+i).value})\n`;
                        }
                    }
                }
                else if (layanan === 'Akta Kelahiran Tanpa NIK') {
                    rincian += "--- DATA SAKSI ---\n";
                    rincian += "Saksi 1: " + document.getElementById('nik_saksi_1').value + " - " + document.getElementById('nama_saksi_1').value + "\n";
                    rincian += "Saksi 2: " + document.getElementById('nik_saksi_2').value + " - " + document.getElementById('nama_saksi_2').value + "\n\n";
                    rincian += "--- DATA ORANG TUA ---\n";
                    rincian += "Ayah: " + document.getElementById('nik_ayah').value + " - " + document.getElementById('nama_ayah').value + "\n";
                    rincian += "Ibu: " + document.getElementById('nik_ibu').value + " - " + document.getElementById('nama_ibu').value + "\n\n";
                    rincian += "--- BIODATA ANAK ---\n";
                    rincian += "Nama Anak: " + document.getElementById('nama_anak').value + "\n";
                    rincian += "Tempat, Tgl Lahir: " + document.getElementById('tempat_lahir_anak').value + ", " + document.getElementById('tgl_lahir_anak').value + "\n";
                    rincian += "Waktu Lahir: " + document.getElementById('waktu_lahir_anak').value + " WIB\n";
                    rincian += "Anak Ke: " + document.getElementById('anak_ke').value + "\n";
                    rincian += "Berat/Panjang: " + document.getElementById('berat_anak').value + " kg / " + document.getElementById('panjang_anak').value + " cm\n";
                    rincian += "Keterangan: " + (document.getElementById('keterangan_akta').value || "-");
                }

                // Buat Tiket Acak
                const tiketAcak = 'TKT-' + Math.floor(100000 + Math.random() * 900000);
                
                // Simpan Sementara
                dataDraft = { nik: nik, no_kk: no_kk, nama: nama, no_wa: no_wa, email: email, layanan: layanan, tiket: tiketAcak, rincian_data: rincian };
                
                tampilkanRingkasan();

            } catch (err) { 
                alert("Gagal menghubungi server: " + err.message); 
            } finally { 
                btn.innerHTML = teksAsli; btn.disabled = false; 
            }
        }

        // TAMPILKAN MODAL POPUP
        function tampilkanRingkasan() {
            document.activeElement.blur(); 
            document.getElementById('isiRingkasan').innerHTML = `
                <div style="font-weight:bold; margin-bottom: 8px;">No Tiket: <span style="color:#2563eb; font-size:16px;">${dataDraft.tiket}</span></div>
                <div style="margin-bottom: 5px;"><strong>Layanan:</strong> ${dataDraft.layanan}</div>
                <div style="margin-bottom: 5px;"><strong>Pemohon:</strong> ${dataDraft.nama}</div>
                <div style="margin-bottom: 5px;"><strong>NIK:</strong> ${dataDraft.nik}</div>
            `;
            document.getElementById('modalRingkasan').style.display = 'flex';
        }

        function tutupModal() { 
            document.getElementById('modalRingkasan').style.display = 'none'; 
        }

        // FUNGSI UPLOAD FILE KE STORAGE
        async function uploadDokumenWarga(inputId, namaKolom) {
            const fileInput = document.getElementById(inputId);
            if (fileInput && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const ekstensi = file.name.split('.').pop();
                const namaFileUnik = `warga_${dataDraft.tiket}_${namaKolom}_${Date.now()}.${ekstensi}`;
                const { error: uploadError } = await supabaseClient.storage.from('dokumen').upload(namaFileUnik, file);
                if (uploadError) throw new Error(`Gagal mengunggah ${namaKolom}: ` + uploadError.message);
                const { data: publicUrlData } = supabaseClient.storage.from('dokumen').getPublicUrl(namaFileUnik);
                return publicUrlData.publicUrl; 
            }
            return null;
        }

        // KLIK TOMBOL KIRIM DI DALAM MODAL
        async function prosesKirimAkhir() {
            const btnKirim = document.getElementById('btnKonfirmasi');
            const btnBatal = document.getElementById('btnBatal');
            const modalKonten = document.getElementById('modalKonten');

            btnKirim.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Sedang Mengunggah Dokumen...";
            btnKirim.disabled = true; 
            btnBatal.disabled = true;

            try {
                let dataUploadUrls = {};

                // Proses Upload Berdasarkan Layanan
                if (dataDraft.layanan === 'Cetak Kartu Keluarga') {
                    const f1 = await uploadDokumenWarga('file_kk_hilang', 'file_kk_hilang'); if(f1) dataUploadUrls.file_kk_hilang = f1;
                    const f2 = await uploadDokumenWarga('dokumen_pendukung_kk', 'dokumen_pendukung_kk'); if(f2) dataUploadUrls.dokumen_pendukung_kk = f2;
                } 
                else if (dataDraft.layanan === 'Cetak Ulang KTP-El') {
                    const f1 = await uploadDokumenWarga('file_ktp', 'file_ktp'); if(f1) dataUploadUrls.file_ktp = f1;
                    const f2 = await uploadDokumenWarga('file_kk', 'file_kk'); if(f2) dataUploadUrls.file_kk = f2;
                } 
                else if (dataDraft.layanan === 'Perbaikan Data') {
                    const f1 = await uploadDokumenWarga('file_f106', 'file_f106'); if(f1) dataUploadUrls.file_f106 = f1;
                    const f2 = await uploadDokumenWarga('dokumen_tambahan_perbaikan', 'dokumen_tambahan_perbaikan'); if(f2) dataUploadUrls.dokumen_tambahan_perbaikan = f2;
                    const f3 = await uploadDokumenWarga('dokumen_pendukung_1', 'dokumen_pendukung_1'); if(f3) dataUploadUrls.dokumen_pendukung_1 = f3;
                    const f4 = await uploadDokumenWarga('dokumen_pendukung_2', 'dokumen_pendukung_2'); if(f4) dataUploadUrls.dokumen_pendukung_2 = f4;
                } 
                else if (dataDraft.layanan === 'Pindah Keluar') {
                    const f1 = await uploadDokumenWarga('file_kk_pindah', 'file_kk_pindah'); if(f1) dataUploadUrls.file_kk_pindah = f1;
                    const f2 = await uploadDokumenWarga('file_ktp_pindah', 'file_ktp_pindah'); if(f2) dataUploadUrls.file_ktp_pindah = f2;
                }
                else if (dataDraft.layanan === 'Akta Kelahiran Tanpa NIK') {
                    const keys = ['file_akta_f201', 'file_akta_kk', 'file_akta_ket_lahir', 'file_akta_buku_nikah_1', 'file_akta_buku_nikah_2', 'file_akta_buku_nikah_3', 'file_akta_ktp_ibu', 'file_akta_ktp_ayah', 'file_akta_pendukung', 'file_akta_pendukung_1', 'file_akta_pendukung_2'];
                    for (let key of keys) {
                        const url = await uploadDokumenWarga(key, key);
                        if (url) dataUploadUrls[key] = url;
                    }
                }

                btnKirim.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Menyimpan ke Server...";

                // Insert ke Database
                const dataFinalInsert = {
                    nomor_tiket: dataDraft.tiket, nik: dataDraft.nik, no_kk: dataDraft.no_kk, 
                    no_wa: dataDraft.no_wa, email: dataDraft.email, nama_pemohon: dataDraft.nama,
                    jenis_layanan: dataDraft.layanan, status: 'Menunggu',
                    rincian_data: dataDraft.rincian_data, ...dataUploadUrls 
                };

                const { error } = await supabaseClient.from('permohonan').insert([dataFinalInsert]);
                if (error) throw error;

                // Tampilan Sukses
                modalKonten.innerHTML = `
                    <div style="text-align: center; padding: 10px;">
                        <i class="fas fa-check-circle" style="color: #10b981; font-size: 65px; margin-bottom: 15px;"></i>
                        <h2 style="color: #1e293b; margin-bottom: 10px;">Berkas Terkirim!</h2>
                        <p style="color: #64748b; font-size: 15px; margin-bottom: 25px;">
                            Permohonan Anda masuk dengan Nomor Tiket:<br><strong style="color: #2563eb; font-size: 20px;">${dataDraft.tiket}</strong>
                        </p>
                        <p style="font-size:12px; color:#f59e0b; margin-bottom:5px; font-weight:bold;">Mengarahkan ke halaman status...</p>
                        <div style="width: 100%; background: #e2e8f0; height: 6px; border-radius: 10px; overflow: hidden;">
                            <div style="width: 100%; height: 100%; background: #f59e0b; transition: width 2s ease; width: 100%;"></div>
                        </div>
                    </div>`;
                    
                setTimeout(() => { window.location.href = `status.html?nik=${dataDraft.nik}`; }, 2500);

            } catch (err) {
                alert("Gagal mengirim permohonan: " + err.message);
                btnKirim.innerHTML = "<i class='fas fa-upload'></i> Coba Kirim Ulang";
                btnKirim.disabled = false; 
                btnBatal.disabled = false;
            }
        }
    </script>
</body>
