<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status Permohonan | SIPPAK-CIB</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        body { background: #f1f5f9; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { background: #fff; width: 100%; max-width: 500px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 40px; text-align: center; }
        
        .header-icon { font-size: 45px; color: #2563eb; margin-bottom: 15px; }
        h2 { font-size: 24px; font-weight: 800; margin-bottom: 5px; }
        p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }

        .search-box { position: relative; margin-bottom: 25px; }
        .search-box input { width: 100%; padding: 16px 20px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; font-weight: bold; outline: none; transition: 0.3s; text-align: center; }
        .search-box input:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
        
        .btn-cari { background: #2563eb; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-cari:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37,99,235,0.2); }

        /* KARTU HASIL */
        #hasilPencarian { display: none; margin-top: 30px; text-align: left; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; animation: fadeIn 0.4s ease-out; }
        .hasil-item { margin-bottom: 15px; }
        .hasil-label { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .hasil-value { font-size: 16px; font-weight: 800; color: #1e293b; }
        
        .badge-status { display: inline-block; padding: 8px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: 5px; }
        .badge-pending { background: #fefce8; color: #ca8a04; border: 1px solid #fef08a; }
        .badge-proses { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .badge-sukses { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        .btn-download { display: none; background: #10b981; color: white; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; text-align: center; text-decoration: none; margin-top: 20px; transition: 0.2s; }
        .btn-download:hover { background: #059669; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-icon"><i class="fas fa-search-location"></i></div>
        <h2>Cek Status Permohonan</h2>
        <p class="subtitle">Masukkan Kode/ID Pelacakan yang Anda dapatkan saat mendaftar.</p>

        <form onsubmit="lacakStatus(event)">
            <div class="search-box">
                <input type="text" id="inpKode" placeholder="Contoh: a1b2c3d4-..." required autocomplete="off">
            </div>
            <button type="submit" class="btn-cari" id="btnCari"><i class="fas fa-search"></i> Lacak Sekarang</button>
        </form>

        <div id="hasilPencarian">
            <div class="hasil-item">
                <div class="hasil-label">Nama Pemohon</div>
                <div class="hasil-value" id="resNama">-</div>
            </div>
            <div class="hasil-item">
                <div class="hasil-label">Jenis Surat</div>
                <div class="hasil-value" id="resJenis">-</div>
            </div>
            <div class="hasil-item" style="margin-bottom: 0;">
                <div class="hasil-label">Status Saat Ini</div>
                <div id="resStatusBadge" class="badge-status badge-pending">Menunggu Antrean</div>
            </div>

            <!-- Tombol Download Dinamis -->
            <a href="#" target="_blank" class="btn-download" id="btnDownloadDokumen">
                <i class="fas fa-file-download"></i> Unduh Dokumen Hasil
            </a>
        </div>
    </div>

    <!-- SUPABASE SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const URL_DB = 'https://ufplggwklwopzhhwrdqk.supabase.co';
        const KEY_DB = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmcGxnZ3drbHdvcHpoaHdyZHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0Nzc1NDgsImV4cCI6MjEwMDA1MzU0OH0.ftwHcf3pkJkTJUDCYQJDiWVyRzfvbq10CoT6T7B0hEo';
        const supabaseClient = window.supabase.createClient(URL_DB, KEY_DB);

        async function lacakStatus(e) {
            e.preventDefault();
            const btn = document.getElementById('btnCari');
            const kode = document.getElementById('inpKode').value.trim();
            const boxHasil = document.getElementById('hasilPencarian');
            const btnDownload = document.getElementById('btnDownloadDokumen');
            
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Mencari...";
            btn.disabled = true;
            boxHasil.style.display = 'none';
            btnDownload.style.display = 'none'; // Sembunyikan tombol download awal

            try {
                // Cari berdasarkan ID di tabel permohonan
                const { data, error } = await supabaseClient
                    .from('permohonan')
                    .select('*')
                    .eq('id', kode)
                    .single();

                if (error || !data) {
                    throw new Error("Kode pelacakan tidak ditemukan. Pastikan kode yang dimasukkan benar.");
                }

                // Tampilkan Data
                document.getElementById('resNama').innerText = data.nama_pemohon || data.nama_lengkap || '-';
                document.getElementById('resJenis').innerText = data.jenis_surat || '-';
                
                // Styling Badge Status
                const statusTeks = data.status || 'Menunggu Antrean';
                const badge = document.getElementById('resStatusBadge');
                badge.innerText = statusTeks;
                badge.className = 'badge-status'; // Reset class

                if (statusTeks.toLowerCase().includes('selesai')) {
                    badge.classList.add('badge-sukses');
                    
                    // Cek jika dokumen_hasil tersedia, munculkan tombol download
                    if (data.dokumen_hasil) {
                        btnDownload.href = data.dokumen_hasil;
                        btnDownload.style.display = 'block';
                    }
                } else if (statusTeks.toLowerCase().includes('proses')) {
                    badge.classList.add('badge-proses');
                } else {
                    badge.classList.add('badge-pending');
                }

                boxHasil.style.display = 'block';

            } catch (err) {
                alert("⚠️ Peringatan: " + err.message);
            } finally {
                btn.innerHTML = "<i class='fas fa-search'></i> Lacak Sekarang";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
