<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Staf | SIPPAK-CIB</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        :root { --primer: #2563eb; --sidebar: #0f172a; --bg: #f1f5f9; --teks-gelap: #1e293b; --teks-pudar: #64748b; }
        
        body { background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: var(--teks-gelap); }
        
        .login-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; width: 100%; max-width: 420px; padding: 40px; text-align: center; }
        .login-header i { font-size: 40px; color: #2563eb; margin-bottom: 15px; }
        .login-header h2 { font-size: 24px; font-weight: 800; color: var(--teks-gelap); margin-bottom: 5px; }
        .login-header p { font-size: 14px; color: var(--teks-pudar); margin-bottom: 30px; font-weight: 600; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #475569; }
        .form-group input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #f8fafc; transition: 0.3s; outline: none; }
        .form-group input:focus { border-color: #2563eb; background: white; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .btn-login { background: #2563eb; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
        .btn-login:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
        
        .back-link { display: block; margin-top: 20px; font-size: 14px; color: var(--teks-pudar); text-decoration: none; font-weight: 600; transition: 0.2s; }
        .back-link:hover { color: var(--primer); }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-landmark"></i>
            <h2>SIPPAK-CIB</h2>
            <p>Silakan login menggunakan akun staf Anda</p>
        </div>

        <form onsubmit="prosesLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username..." required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password..." required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i> Masuk Sistem
            </button>
        </form>

        <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Beranda Utama</a>
    </div>

    <!-- Script Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const URL_DB = 'https://ufplggwklwopzhhwrdqk.supabase.co';
        const KEY_DB = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmcGxnZ3drbHdvcHpoaHdyZHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0Nzc1NDgsImV4cCI6MjEwMDA1MzU0OH0.ftwHcf3pkJkTJUDCYQJDiWVyRzfvbq10CoT6T7B0hEo';
        const supabaseClient = window.supabase.createClient(URL_DB, KEY_DB);

        async function prosesLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const userInp = document.getElementById('username').value.trim();
            const passInp = document.getElementById('password').value.trim();

            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Memeriksa...";
            btn.disabled = true;

            try {
                // 1. Cek kecocokan data ke tabel 'pengguna'
                const { data, error } = await supabaseClient
                    .from('pengguna')
                    .select('*')
                    .eq('username', userInp)
                    .eq('password', passInp)
                    .single();

                if (error || !data) {
                    throw new Error("Username atau Password salah!");
                }

                // 2. Simpan identitas sesi ke localStorage (Sesi 6 jam)
                localStorage.setItem('user_id', data.id);
                localStorage.setItem('user_nama', data.nama_lengkap);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('login_time', new Date().getTime());

                // 3. Catat sesi aktif ke tabel 'sesi_login' untuk pemantauan Super Admin
                const tokenUnikSesi = 'sess_' + Math.random().toString(36).substring(2) + Date.now();
                const { data: dataSesi, error: errorSesi } = await supabaseClient
                    .from('sesi_login')
                    .insert([{
                        user_id: data.id,
                        username: data.username,
                        nama_lengkap: data.nama_lengkap,
                        role: data.role,
                        token_sesi: tokenUnikSesi
                    }])
                    .select()
                    .single();

                if (!errorSesi && dataSesi) {
                    localStorage.setItem('active_session_id', dataSesi.id);
                }

                // 4. Redirect ke dashboard utama
                window.location.href = "dashboard-master.html";

            } catch (err) {
                alert("⚠️ Gagal Login: " + err.message);
                btn.innerHTML = "<i class='fas fa-sign-in-alt'></i> Masuk Sistem";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
