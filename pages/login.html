<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Petugas | SIPPAK-CIB</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        body { 
            background-color: #0f172a; /* Warna gelap sesuai gambar */
            display: flex; justify-content: center; align-items: center; height: 100vh; color: #1e293b;
        }
        
        .login-card {
            background: #ffffff;
            width: 100%; max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .icon-fingerprint {
            background: #eff6ff;
            width: 70px; height: 70px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px auto;
            color: #2563eb;
            font-size: 35px;
        }

        .login-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 5px; color: #0f172a; }
        .login-card p { font-size: 14px; color: #64748b; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; text-align: left; position: relative; }
        .form-group i {
            position: absolute; left: 15px; top: 15px; color: #94a3b8; font-size: 16px;
        }
        .form-group input {
            width: 100%; padding: 15px 15px 15px 45px;
            border: 1px solid #cbd5e1; border-radius: 12px;
            font-size: 15px; background: #f8fafc; transition: 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #2563eb; background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .btn-login {
            background: #1e3a8a; /* Biru gelap */
            color: white; padding: 15px; width: 100%;
            border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-login:hover { background: #172554; }

        .link-kembali { color: #64748b; text-decoration: none; font-size: 14px; font-weight: 600; display: inline-block; transition: 0.2s; }
        .link-kembali:hover { color: #1e293b; }

    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-fingerprint"><i class="fas fa-fingerprint"></i></div>
        <h2>Portal Petugas</h2>
        <p>Silakan masuk menggunakan kredensial Anda.</p>

        <form onsubmit="prosesLogin(event)">
            <div class="form-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Alamat Email" required>
            </div>
            
            <div class="form-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Kata Sandi" required>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">Masuk Sistem</button>
        </form>

        <a href="../index.html" class="link-kembali"><i class="fas fa-arrow-left"></i> Kembali ke Beranda Warga</a>
    </div>

    <!-- SCRIPT SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const URL_DB = 'https://ufplggwklwopzhhwrdqk.supabase.co';
        const KEY_DB = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmcGxnZ3drbHdvcHpoaHdyZHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0Nzc1NDgsImV4cCI6MjEwMDA1MzU0OH0.ftwHcf3pkJkTJUDCYQJDiWVyRzfvbq10CoT6T7B0hEo';
        const supabaseClient = window.supabase.createClient(URL_DB, KEY_DB);

        async function prosesLogin(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btnLogin');
            const teksAsli = btn.innerHTML;
            
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Otentikasi...";
            btn.disabled = true;

            try {
                // ⚠️ PERHATIKAN BARIS INI ⚠️
                // Ganti 'username' di bawah ini dengan nama kolom asli di Supabase Anda
                // jika nama kolomnya bukan username (misal: 'alamat_email' atau 'email_pengguna')
                const { data, error } = await supabaseClient
                    .from('pengguna')
                    .select('*')
                    .ilike('username', emailInput); 

                if (error) throw error;

                if (!data || data.length === 0) {
                    throw new Error("Akun tidak ditemukan. Pastikan email benar.");
                }

                const user = data[0]; 

                // ⚠️ PERHATIKAN BARIS INI JUGA ⚠️
                // Pastikan kolom password di database Anda namanya benar-benar 'password'
                // Jika namanya 'kata_sandi', ubah menjadi user.kata_sandi
                if (user.password !== passwordInput) {
                    throw new Error("Kata Sandi (Password) salah!");
                }

                // Menyimpan sesi lokal (Pastikan kolom role, nama, dan username ada di database)
                localStorage.setItem('user_role', user.role); 
                localStorage.setItem('user_nama', user.nama);
                localStorage.setItem('user_email', user.username); // Sesuaikan juga di sini

                window.location.href = "dashboard-master.html";

            } catch (err) {
                alert("GAGAL LOGIN:\n" + err.message);
                btn.innerHTML = teksAsli;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
