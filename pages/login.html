<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Petugas | SIPPAK-CIB</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        body { background: linear-gradient(135deg, #1e293b, #0f172a); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .login-card { background: white; width: 100%; max-width: 420px; padding: 40px 30px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center; position: relative; overflow: hidden; }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, #3b82f6, #10b981); }
        
        .logo-box { width: 70px; height: 70px; background: #f1f5f9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #3b82f6; margin: 0 auto 15px; }
        .login-card h2 { color: #1e293b; font-size: 24px; margin-bottom: 5px; }
        .login-card p { color: #64748b; font-size: 14px; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 8px; }
        .input-icon { position: absolute; bottom: 14px; left: 15px; color: #94a3b8; font-size: 16px; }
        .form-group input { width: 100%; padding: 14px 15px 14px 45px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; background: #f8fafc; transition: 0.3s; }
        .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); background: white; }

        .btn-login { background: #2563eb; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-login:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3); }
        .btn-back { display: block; margin-top: 25px; color: #64748b; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; }
        .btn-back:hover { color: #1e293b; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box"><i class="fas fa-fingerprint"></i></div>
        <h2>Portal Petugas</h2>
        <p>Gunakan kredensial Anda untuk masuk ke sistem.</p>

        <form onsubmit="prosesLogin(event)">
            <div class="form-group">
                <label>Alamat Email</label>
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="emailVal" required placeholder="admin@kelurahan.com">
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="passwordVal" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Masuk ke Dasbor</button>
        </form>
        
        <a href="../index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Beranda Warga</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const URL_DB = 'https://ufplggwklwopzhhwrdqk.supabase.co';
        const KEY_DB = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmcGxnZ3drbHdvcHpoaHdyZHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0Nzc1NDgsImV4cCI6MjEwMDA1MzU0OH0.ftwHcf3pkJkTJUDCYQJDiWVyRzfvbq10CoT6T7B0hEo';
        const supabaseAuth = window.supabase.createClient(URL_DB, KEY_DB);

        async function prosesLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('btnLogin');
            const email = document.getElementById('emailVal').value;
            const password = document.getElementById('passwordVal').value;

            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Otentikasi...";
            btn.disabled = true;

            try {
                const { data: authData, error: authError } = await supabaseAuth.auth.signInWithPassword({ email, password });
                if (authError) throw authError; 

                const { data: profileData, error: profileError } = await supabaseAuth
                    .from('profiles').select('role, nama_lengkap').eq('id', authData.user.id).single();

                if (profileError || !profileData) throw new Error("Akses ditolak. Profil tidak ditemukan.");

                const role = profileData.role.toLowerCase();
                localStorage.setItem('user_role', role);
                localStorage.setItem('user_nama', profileData.nama_lengkap);

                if (role === 'petugas' || role === 'superadmin') {
                    window.location.href = "dashboard-master.html";
                } else {
                    throw new Error("Akun ini bukan milik petugas.");
                }
            } catch (err) {
                alert("GAGAL LOGIN:\nEmail atau Password Salah!");
                btn.innerHTML = "Masuk ke Dasbor";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
