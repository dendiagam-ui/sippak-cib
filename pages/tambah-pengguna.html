<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Akun | SIPPAK-CIB</title>
    <!-- ========================================== -->
    <!-- 🚀 TEKNOLOGI PRE-CACHE (MEMPERCEPAT LOADING) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://ufplggwklwopzhhwrdqk.supabase.co" crossorigin> <!-- Opsional: Ganti dengan URL Supabase Anda -->
    
    <!-- Memaksa browser menyimpan Mesin Supabase & Ikon ke RAM -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" as="script">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" as="style">
    <!-- ========================================== -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 🚀 TAMBAHKAN KODE INI UNTUK TRANSISI HALUS */
        body { 
            animation: fadeInPage 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; 
            /* Sembunyikan scrollbar yang sering bikin patah-patah */
            overflow-x: hidden; 
        }

        @keyframes fadeInPage {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* ========================================== */

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        body { background-color: #f8fafc; padding: 20px; color: #334155; }
        .container { max-width: 500px; margin: 40px auto; background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .btn-back { text-decoration: none; color: #2563eb; font-weight: 600; margin-bottom: 25px; display: inline-block; font-size: 15px; }
        .btn-back:hover { text-decoration: underline; }
        h2 { color: #1e293b; margin-bottom: 8px; font-size: 24px; }
        .subtitle { font-size: 14px; color: #64748b; margin-bottom: 25px; border-bottom: 1px solid #e2e8f0; padding-bottom: 20px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: #475569; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #f8fafc; transition: 0.3s; }
        input:focus { outline: none; border-color: #2563eb; background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-submit { background: #2563eb; color: white; width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .btn-submit:hover { background: #1d4ed8; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <a href="dashboard-master.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Dasbor</a>
        
        <h2 id="judulHalaman"><i class="fas fa-user-plus"></i> Tambah Akun</h2>
        <p class="subtitle" id="subJudul">Formulir pendaftaran akun sistem.</p>

        <form id="formTambah" onsubmit="buatAkunAdmin(event)">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="inpNama" required placeholder="Masukkan nama lengkap">
            </div>
            <div class="form-group">
                <label id="labelIdentitas">Nomor Identitas</label>
                <input type="text" id="inpNik" required placeholder="Ketik NIK / NIP">
            </div>
            <div class="form-group">
                <label>Email Akses Login</label>
                <input type="email" id="inpEmail" required placeholder="nama@gmail.com">
            </div>
            <div class="form-group">
                <label>Kata Sandi Sementara</label>
                <input type="text" id="inpPassword" required minlength="6" placeholder="Minimal 6 karakter">
            </div>
            <button type="submit" class="btn-submit" id="btnSimpan"><i class="fas fa-save"></i> Daftarkan Akun Sekarang</button>
        </form>
    </div>

    <!-- Panggil Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>

    <script>
        // Ambil parameter role dari URL saat halaman dimuat
        const urlParams = new URLSearchParams(window.location.search);
        const targetRole = urlParams.get('role'); 

        if (targetRole === 'warga') {
            document.getElementById('judulHalaman').innerHTML = '<i class="fas fa-user-plus"></i> Tambah Akun Warga';
            document.getElementById('subJudul').innerText = "Daftarkan warga yang tidak dapat mendaftar mandiri.";
            document.getElementById('labelIdentitas').innerText = "Nomor Induk Kependudukan (NIK)";
        } else if (targetRole === 'petugas') {
            document.getElementById('judulHalaman').innerHTML = '<i class="fas fa-user-shield"></i> Tambah Akun Petugas';
            document.getElementById('subJudul').innerText = "Daftarkan staf Kelurahan baru.";
            document.getElementById('labelIdentitas').innerText = "NIP / ID Petugas";
        }

        // FUNGSI UTAMA SAAT TOMBOL DIKLIK
        async function buatAkunAdmin(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btnSimpan');
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Memproses...";
            btn.disabled = true;

            try {
              
                // =========================================================================
                // ⚠️ MASUKKAN KUNCI SERVICE ROLE & URL SUPABASE ANDA LANGSUNG DI SINI ⚠️
                // =========================================================================
                const MY_SUPABASE_URL = "https://ufplggwklwopzhhwrdqk.supabase.co"; // Ganti dengan URL Anda
                const MY_SERVICE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmcGxnZ3drbHdvcHpoaHdyZHFrIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDQ3NzU0OCwiZXhwIjoyMTAwMDUzNTQ4fQ.SG5tlqbQdwAvsjtHx_161GQLfM6JB3DRzXQuxp80NJI"; // Ganti dengan Service Role Key Anda
                // =========================================================================

                if (MY_SERVICE_KEY.includes("eyJhbGciOi") === false) {
                    throw new Error("Silakan masukkan Service Role Key yang valid di dalam file tambah-pengguna.html!");
                }

                // Inisialisasi klien khusus admin di dalam fungsi
                const supabaseAdmin = window.supabase.createClient(MY_SUPABASE_URL, MY_SERVICE_KEY, {
                    auth: { autoRefreshToken: false, persistSession: false }
                });

                const nama = document.getElementById('inpNama').value;
                const nik = document.getElementById('inpNik').value;
                const email = document.getElementById('inpEmail').value;
                const password = document.getElementById('inpPassword').value;

                // 1. Buat akun auth
                const { data: authData, error: authErr } = await supabaseAdmin.auth.admin.createUser({
                    email: email,
                    password: password,
                    email_confirm: true 
                });
                
                if (authErr) throw authErr;

                // 2. Simpan ke tabel profiles
                const { error: dbErr } = await supabaseAdmin.from('profiles').insert([{
                    id: authData.user.id,
                    email: email,
                    nama_lengkap: nama,
                    nik: nik,
                    role: targetRole
                }]);

                if (dbErr) {
                    await supabaseAdmin.auth.admin.deleteUser(authData.user.id);
                    throw dbErr;
                }

                alert(`✅ SUKSES!\nAkun ${targetRole.toUpperCase()} berhasil dibuat.\nEmail: ${email}\nPassword: ${password}`);
                document.getElementById('formTambah').reset();

            } catch (err) {
                alert("Gagal: " + err.message)
            } finally {
                btn.innerHTML = "<i class='fas fa-save'></i> Daftarkan Akun Sekarang";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
