<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Warga | SIPPAK-CIB</title>
        <!-- ========================================== -->
    <!-- 🚀 TEKNOLOGI PRE-CACHE (MEMPERCEPAT LOADING) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://ufplggwklwopzhhwrdqk.supabase.co" crossorigin> <!-- Opsional: Ganti dengan URL Supabase Anda -->
    
    <!-- Memaksa browser menyimpan Mesin Supabase & Ikon ke RAM -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" as="script">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" as="style">
    <!-- ========================================== -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 🚀 TAMBAHKAN KODE INI UNTUK TRANSISI HALUS */
        body { 
            animation: fadeInPage 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; 
            /* Sembunyikan scrollbar yang sering bikin patah-patah */
            overflow-x: hidden; 
        }

        @keyframes fadeInPage {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* ========================================== */

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #0056b3, #00d2ff); 
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .login-card {
            background: white; width: 100%; max-width: 450px; padding: 30px; 
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
        }
        .logo-box {
            background: #e8f4fd; width: 60px; height: 60px; margin: 0 auto 15px auto;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: #0056b3;
        }
        .login-card h2 { color: #333; margin-bottom: 5px; }
        .login-card p { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .grup-input { text-align: left; margin-bottom: 15px; position: relative; }
        .grup-input label { display: block; font-weight: bold; font-size: 13px; color: #444; margin-bottom: 5px; }
        .grup-input input {
            width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
            transition: 0.3s;
        }
        .grup-input input:focus { border-color: #0056b3; outline: none; box-shadow: 0 0 5px rgba(0,86,179,0.2); }
        
        .btn-login {
            background: #28a745; color: white; width: 100%; padding: 12px; border: none;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover { background: #218838; }
        
        .alert-box {
            display: none; background: #f8d7da; color: #721c24; padding: 10px; 
            border-radius: 5px; font-size: 13px; margin-bottom: 15px; text-align: left; border: 1px solid #f5c6cb;
        }
        
        .footer-link { margin-top: 20px; font-size: 13px; color: #666; }
        .footer-link a { color: #0056b3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">
            <i class="fas fa-user-plus"></i>
        </div>
        <h2>Daftar Akun Warga</h2>
        <p>Lengkapi data diri Anda untuk membuat akun</p>

        <!-- Kotak Peringatan Error -->
        <div id="alertBox" class="alert-box"></div>

        <form id="formDaftar" onsubmit="prosesDaftar(event)">
            <div class="grup-input">
                <label>Nomor Induk Kependudukan (NIK) *</label>
                <input type="number" id="regNik" placeholder="16 Digit NIK KTP" required>
            </div>
            <div class="grup-input">
                <label>Nama Lengkap (Sesuai KTP) *</label>
                <input type="text" id="regNama" placeholder="Contoh: Budi Santoso" required>
            </div>
            <div class="grup-input">
                <label>Email Aktif *</label>
                <input type="email" id="regEmail" placeholder="nama@email.com" required>
            </div>
            <div class="grup-input">
                <label>Buat Kata Sandi *</label>
                <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required minlength="6">
            </div>

            <button type="submit" id="btnDaftar" class="btn-login">Mendaftar Sekarang</button>
        </form>

        <div class="footer-link">
            Sudah punya akun? <a href="login.html">Kembali ke Login</a>
        </div>
    </div>

    <!-- Panggil Supabase dan Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/daftar.js"></script>
</body>
</html>
